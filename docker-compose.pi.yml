services:
  backend:
    # Полностью переопределяем backend для Raspberry Pi
    # Используем network_mode: host для доступа к localhost:8001
    # ВАЖНО: network_mode и networks взаимоисключающие
    # При объединении файлов нужно явно убрать networks из базового файла
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=8080
      - DETECTION_URL=${DETECTION_URL:-http://localhost:8001}
    network_mode: host
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ./data:/app/data
    # При network_mode: host не используем ports и depends_on
    # networks не указываем вообще - это убирает наследование из базового файла

  # Detection service запускается отдельно от Docker
  # Запустите: cd services/detection && python3 detection_server.py

  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_dist:/dist
    networks: [app]
    command: >-
      sh -c "\
      if [ -f package-lock.json ]; then \
        npm ci --prefer-offline --no-audit --no-fund; \
      else \
        npm install --no-audit --no-fund; \
      fi \
      && npm run build \
      && rm -rf /dist/* \
      && cp -r dist/* /dist/"

  frontend:
    restart: unless-stopped
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro

volumes:
  frontend_dist: {}
